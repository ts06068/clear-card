[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-card-reproducibility"
version = "1.0.0"
description = "Reproducibility pipeline for the CLEAR-CARD manuscript"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cycler==0.12.1",
  "matplotlib==3.10.1",
  "numpy==2.2.3",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
db = ["pyodbc==5.2.0"]
notebook = ["jupyterlab>=4.3,<5", "nbconvert>=7.16,<8"]
test = ["pytest>=8.3,<9"]
# CI-only tools stay separate from the pinned manuscript runtime.
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff==0.16.0",
]

[project.scripts]
clear-card = "clear_card.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
